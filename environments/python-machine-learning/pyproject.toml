[project]
name = "ml-project-template"
version = "0.1.0"
description = "Machine Learning environment with PyTorch, TensorFlow, and Data Analysis tools"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "tensorflow",
    "keras",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "jupyter",
    "tqdm"
]
